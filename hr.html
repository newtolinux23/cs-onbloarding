<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HR – New Hire Submissions · C &amp; S Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  :root{--ink:#1b2333;--muted:#5b6578;--line:#dfe3ea;--bg:#f5f7fa;--brand:#1f4e8c;--brand2:#2f6fbf;--err:#b42318;--ok:#1f7a4d;--soft:#eef3fb}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  header{background:var(--brand);color:#fff;padding:14px 20px}
  header .wrap{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
  header h1{font-size:16px;margin:0}
  header button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
  main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
  .login{max-width:380px;margin:50px auto}
  h2{font-size:20px;margin:0 0 6px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
  input,select{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid #c9d0db;border-radius:9px}
  button{font:inherit;font-weight:600;font-size:14px;border-radius:9px;padding:9px 16px;border:1px solid transparent;cursor:pointer}
  .primary{background:var(--brand);color:#fff}.ghost{background:#fff;border-color:#c9d0db}.danger{background:#fff;border-color:#f1b4ae;color:var(--err)}
  button:disabled{opacity:.5}
  .msg{font-size:13px;margin-top:10px;color:var(--err);min-height:18px}
  .msg.ok{color:var(--ok)}
  .link{background:none;border:none;color:var(--brand2);padding:0;font-weight:500;font-size:13px;margin-top:12px}
  .layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
  @media (max-width:820px){.layout{grid-template-columns:1fr}}
  .toolbar{display:flex;gap:8px;margin-bottom:10px}
  .list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  .item:last-child{border-bottom:0}
  .item:hover{background:#fafbfd}.item.sel{background:var(--soft)}
  .item b{display:block;font-size:14px}.item small{color:var(--muted);font-size:12px}
  .pill{font-size:11px;font-weight:600;border-radius:20px;padding:3px 8px;height:fit-content;white-space:nowrap}
  .pill.new{background:#e8f0fd;color:var(--brand2)}.pill.reviewed{background:#e3f4ea;color:var(--ok)}.pill.archived{background:#eee;color:#666}
  .empty{padding:30px;text-align:center;color:var(--muted);font-size:14px}
  .detail h3{font-size:14px;margin:18px 0 8px;color:var(--brand)}
  dl{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;margin:0;font-size:14px}
  @media (max-width:560px){dl{grid-template-columns:1fr}}
  dt{color:var(--muted)}dd{margin:0;word-break:break-word}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
  .sigimg{max-width:280px;max-height:80px;border-bottom:1px solid var(--line)}
  .reveal{font-size:12px;color:var(--brand2);cursor:pointer;margin-left:6px}
  .confirm{background:#fff8f7;border:1px solid #f1b4ae;border-radius:10px;padding:12px;margin-top:10px;font-size:14px;display:none}
  .hidden{display:none!important}
</style>
</head>
<body>
<header><div class="wrap"><h1>C &amp; S Delivery · HR new hire submissions</h1><button id="logout" class="hidden">Sign out</button></div></header>
<main>
  <div id="loginView" class="card login hidden">
    <h2>HR sign in</h2>
    <p style="color:var(--muted);font-size:14px;margin:0">Only authorized HR accounts can view submissions.</p>
    <form id="loginForm">
      <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
      <div class="msg" id="loginMsg"></div>
      <button class="primary" style="width:100%;margin-top:6px">Sign in</button>
    </form>
    <button class="link" id="forgot">Forgot password?</button>
  </div>

  <div id="resetView" class="card login hidden">
    <h2>Set a new password</h2>
    <form id="resetForm">
      <label for="npw">New password</label><input id="npw" type="password" autocomplete="new-password" minlength="10" required>
      <div class="msg" id="resetMsg"></div>
      <button class="primary" style="width:100%;margin-top:6px">Save password</button>
    </form>
  </div>

  <div id="appView" class="hidden">
    <div class="layout">
      <div>
        <div class="toolbar">
          <select id="filter"><option value="active">New &amp; reviewed</option><option value="new">New only</option><option value="archived">Archived</option><option value="all">All</option></select>
          <button class="ghost" id="refresh" title="Refresh">↻</button>
        </div>
        <div class="list" id="list"><div class="empty">Loading…</div></div>
      </div>
      <div class="card detail" id="detail"><div class="empty">Select a submission to see it.</div></div>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://yxpjitdqqodfyqxvwglv.supabase.co";
const SUPABASE_KEY = "sb_publishable_jibRZ8TZlJvnEJGABG_Vbg_GGYHUhcg";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, storage: window.sessionStorage } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let rows = [], current = null;

// Fills the fillable packet template from one hr_enrollments row. Works in browser (window.PDFLib) and node.
async function fillPacket(PDFLib, templateBytes, row) {
  const { PDFDocument } = PDFLib;
  const doc = await PDFDocument.load(templateBytes);
  const form = doc.getForm();
  const d = row.data || {};
  const pageOf = { DD_: 0, I9_: 1, W4_: 2 };
  for (const f of form.getFields()) {
    const name = f.getName();
    const v = d[name];
    if (v === undefined || v === null || v === "" || v === false) continue;
    try {
      if (f instanceof PDFLib.PDFTextField) f.setText(String(v));
      else if (f instanceof PDFLib.PDFDropdown) { f.select(String(v)); try { f.setFontSize(9); } catch (e) {} }
      else if (f instanceof PDFLib.PDFRadioGroup) f.select(String(v));
      else if (f instanceof PDFLib.PDFCheckBox) { if (v === true || v === "Yes") f.check(); }
    } catch (e) { console.warn("field", name, e.message); }
  }
  // place drawn signature images where the signature boxes are
  const sigs = row.signatures || {};
  for (const f of form.getFields()) {
    if (!(f instanceof PDFLib.PDFSignature)) continue;
    const name = f.getName();
    const png = sigs[name] || (/EmployeeSignature$/.test(name) ? sigs.employee : null);
    if (!png) continue;
    const rect = f.acroField.getWidgets()[0].getRectangle();
    const page = doc.getPage(pageOf[name.slice(0, 3)]);
    const img = await doc.embedPng(png);
    const s = Math.min(rect.width / img.width, rect.height / img.height);
    const w = img.width * s, h = img.height * s;
    page.drawImage(img, { x: rect.x + 2, y: rect.y + (rect.height - h) / 2, width: w, height: h });
    form.removeField(f);
  }
  form.acroForm.dict.set(PDFLib.PDFName.of('NeedAppearances'), PDFLib.PDFBool.False);
  return await doc.save();
}



function view(v) { ["loginView", "resetView", "appView"].forEach(id => $(id).classList.toggle("hidden", id !== v)); $("logout").classList.toggle("hidden", v !== "appView"); }

sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "PASSWORD_RECOVERY") return view("resetView");
  if (session) { view("appView"); load(); } else view("loginView");
});
$("loginForm").onsubmit = async e => {
  e.preventDefault(); $("loginMsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (error) $("loginMsg").textContent = error.message;
};
$("forgot").onclick = async () => {
  const em = $("em").value.trim(); if (!em) { $("loginMsg").textContent = "Enter your email first."; return; }
  const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.href.split("#")[0] });
  $("loginMsg").className = error ? "msg" : "msg ok"; $("loginMsg").textContent = error ? error.message : "If that account exists, a reset link was emailed.";
};
$("resetForm").onsubmit = async e => {
  e.preventDefault(); const { error } = await sb.auth.updateUser({ password: $("npw").value });
  if (error) $("resetMsg").textContent = error.message; else { history.replaceState(null, "", location.pathname); view("appView"); load(); }
};
$("logout").onclick = () => sb.auth.signOut();
$("refresh").onclick = () => load();
$("filter").onchange = () => load();

async function load() {
  $("list").innerHTML = '<div class="empty">Loading…</div>';
  let q = sb.from("hr_enrollments").select("id,created_at,employee_name,employee_email,status").order("created_at", { ascending: false }).limit(500);
  const f = $("filter").value;
  if (f === "active") q = q.in("status", ["new", "reviewed"]); else if (f !== "all") q = q.eq("status", f);
  const { data, error } = await q;
  if (error) { $("list").innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  rows = data;
  if (!rows.length) { $("list").innerHTML = '<div class="empty">No submissions here yet. If you expected some, make sure you signed in with the HR account.</div>'; return; }
  $("list").innerHTML = rows.map(r => `<div class="item ${current && current.id === r.id ? "sel" : ""}" data-id="${r.id}"><div><b>${esc(r.employee_name)}</b><small>${new Date(r.created_at).toLocaleString()}</small></div><span class="pill ${r.status}">${r.status}</span></div>`).join("");
  $("list").querySelectorAll(".item").forEach(el => el.onclick = () => open(el.dataset.id));
}

const FILING = { Single_MFS: "Single or Married filing separately", MFJ_QSS: "Married filing jointly / Qualifying surviving spouse", HeadOfHousehold: "Head of household" };
const CIT = { "1_Citizen": "1. U.S. citizen", "2_NoncitizenNational": "2. Noncitizen national", "3_PermanentResident": "3. Lawful permanent resident", "4_AlienAuthorized": "4. Noncitizen authorized to work" };
const maskv = (s, k = 4) => s ? `<span data-full="${esc(s)}">${"•".repeat(Math.max(0, s.length - k)) + esc(s.slice(-k))}</span><span class="reveal">show</span>` : "";

async function open(id) {
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("sel", el.dataset.id === id));
  $("detail").innerHTML = '<div class="empty">Loading…</div>';
  const { data, error } = await sb.from("hr_enrollments").select("*").eq("id", id).single();
  if (error) { $("detail").innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  current = data; const d = data.data || {}, m = d._meta || {};
  const blk = (t, rs) => `<h3>${t}</h3><dl>${rs.filter(r => r[1] !== undefined && r[1] !== "" && r[1] !== false && r[1] !== null).map(r => `<dt>${r[0]}</dt><dd>${r[2] ? r[1] : esc(r[1])}</dd>`).join("")}</dl>`;
  $("detail").innerHTML = `
    <h2>${esc(data.employee_name)}</h2>
    <div style="color:var(--muted);font-size:13px">Submitted ${new Date(data.created_at).toLocaleString()} · status: <b>${data.status}</b></div>
    <div class="actions">
      <button class="primary" id="pdf">Download filled PDF</button>
      ${data.status !== "reviewed" ? '<button class="ghost" data-status="reviewed">Mark reviewed</button>' : ""}
      ${data.status !== "archived" ? '<button class="ghost" data-status="archived">Archive</button>' : '<button class="ghost" data-status="new">Restore</button>'}
      <button class="danger" id="del">Delete</button>
    </div>
    <div class="msg" id="actMsg"></div>
    <div class="confirm" id="delBox">Permanently delete this submission? This can't be undone.<div class="actions"><button class="danger" id="delYes">Yes, delete</button><button class="ghost" id="delNo">Cancel</button></div></div>
    ${blk("Employee", [["Name", [d.I9_FirstName, d.I9_MiddleInitial, d.I9_LastName].filter(Boolean).join(" ")], ["Other last names", d.I9_OtherLastNames], ["Address", `${d.I9_Address || ""}${d.I9_Apt && d.I9_Apt !== "N/A" ? ", " + d.I9_Apt : ""}, ${d.I9_City || ""}, ${d.I9_State || ""} ${d.I9_ZIP || ""}`], ["Date of birth", d.I9_DOB], ["SSN", maskv(d.I9_SSN), 1], ["Email", d.I9_Email], ["Phone", d.I9_Phone]])}
    ${blk("Direct deposit", [["Account type", d.DD_AccountType], ["Bank", d.DD_BankName], ["Routing", d.DD_RoutingNumber], ["Account", maskv(d.DD_AccountNumber), 1]])}
    ${blk("W-4", [["Filing status", FILING[d.W4_FilingStatus]], ["2(c) Two jobs", d.W4_Step2c_TwoJobs ? "Yes" : ""], ["3(a) Children", d.W4_Step3a && "$" + d.W4_Step3a], ["3(b) Other dependents", d.W4_Step3b && "$" + d.W4_Step3b], ["Step 3 total", d.W4_Step3Total && "$" + d.W4_Step3Total], ["4(a) Other income", d.W4_Step4a && "$" + d.W4_Step4a], ["4(b) Deductions", d.W4_Step4b && "$" + d.W4_Step4b], ["4(c) Extra withholding", d.W4_Step4c && "$" + d.W4_Step4c], ["Exempt", d.W4_Exempt ? "YES – claims exemption" : ""]])}
    ${blk("I-9 Section 1", [["Status", CIT[d.I9_CitizenshipStatus]], ["USCIS/A-Number (LPR)", d.I9_LPR_USCIS_ANumber], ["Authorization expires", d.I9_AlienExpDate], ["A-Number", d.I9_AlienANumber], ["I-94", d.I9_I94Number], ["Foreign passport", d.I9_ForeignPassport]])}
    ${blk("Signature", [["Signature", data.signatures && data.signatures.employee ? `<img class="sigimg" src="${esc(data.signatures.employee)}" alt="signature">` : "", 1], ["Typed name", m.typed_name], ["Signed", m.signed_at && new Date(m.signed_at).toLocaleString()], ["Attestations", m.attest ? Object.entries(m.attest).map(([k, v]) => `${k.replace("_", " ")}: ${v ? "✓" : "✗"}`).join(" · ") : ""]])}
    <p style="font-size:12px;color:var(--muted);margin-top:18px">Employer sections (I-9 Section 2, W-4 "Employers Only") are left open in the PDF – complete them in Adobe Acrobat after reviewing the employee's original documents.</p>`;
  $("detail").querySelectorAll(".reveal").forEach(el => el.onclick = () => { const s = el.previousElementSibling; s.textContent = s.dataset.full; el.remove(); });
  $("detail").querySelectorAll("[data-status]").forEach(b => b.onclick = () => setStatus(b.dataset.status));
  $("pdf").onclick = downloadPdf;
  $("del").onclick = () => $("delBox").style.display = "block";
  $("delNo").onclick = () => $("delBox").style.display = "none";
  $("delYes").onclick = async () => {
    const { error } = await sb.from("hr_enrollments").delete().eq("id", current.id);
    if (error) { $("actMsg").textContent = error.message; return; }
    current = null; $("detail").innerHTML = '<div class="empty">Deleted.</div>'; load();
  };
}
async function setStatus(s) {
  const { error } = await sb.from("hr_enrollments").update({ status: s }).eq("id", current.id);
  if (error) { $("actMsg").textContent = error.message; return; }
  await load(); open(current.id);
}
let template = null;
async function downloadPdf() {
  const b = $("pdf"); b.disabled = true; b.textContent = "Building PDF…"; $("actMsg").textContent = "";
  try {
    if (!template) { const r = await fetch("packet-template.pdf"); if (!r.ok) throw new Error("packet-template.pdf is missing next to this page."); template = await r.arrayBuffer(); }
    const bytes = await fillPacket(PDFLib, template, current);
    const d = current.data || {}, name = `${d.I9_LastName || "employee"}_${d.I9_FirstName || ""}_new_hire_packet.pdf`.replace(/[^\w.-]+/g, "_");
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  } catch (e) { $("actMsg").textContent = "Couldn't build the PDF: " + e.message; }
  b.disabled = false; b.textContent = "Download filled PDF";
}
</script>
</body>
</html>
