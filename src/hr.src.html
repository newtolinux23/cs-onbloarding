<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f4e8c">

<title>HR – New Hire Submissions · C &amp; S Delivery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  :root{--ink:#1b2333;--muted:#5b6578;--line:#e3e8ef;--bg:#f3f6fa;--brand:#1f4e8c;--brand2:#2f6fbf;--amber:#f2a900;--err:#b42318;--ok:#1f7a4d;--soft:#eef4fc}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  header{background:linear-gradient(120deg,#163b6d,#1f4e8c 55%,#2f6fbf);color:#fff;padding:12px 20px;position:relative;overflow:hidden}
  header .wrap{max-width:1150px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:1}
  header h1{font-size:16px;margin:0;font-weight:700}
  header small{opacity:.8;font-size:12px}
  header .mini{width:74px;flex:none}
  header .brand{display:flex;align-items:center;gap:12px}
  header button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}
  .wheel{transform-box:fill-box;transform-origin:center;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  main{max-width:1150px;margin:0 auto;padding:20px 16px 60px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .login{max-width:390px;margin:46px auto;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  h2{font-size:20px;margin:0 0 6px}
  label{display:block;font-size:12.5px;font-weight:600;margin:10px 0 5px}
  input,select,textarea{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid #c9d0db;border-radius:9px;background:#fff;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(47,111,191,.18)}
  button{font:inherit;font-weight:600;font-size:14px;border-radius:10px;padding:9px 16px;border:1px solid transparent;cursor:pointer;transition:transform .12s,box-shadow .15s,background .15s}
  button:hover:not(:disabled){transform:translateY(-1px)}
  .primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(31,78,140,.25)}.primary:hover{background:#173f73}
  .ghost{background:#fff;border-color:#c9d0db}.danger{background:#fff;border-color:#f1b4ae;color:var(--err)}
  .amber{background:var(--amber);color:#1b2333;box-shadow:0 4px 12px rgba(242,169,0,.3)}
  button:disabled{opacity:.5;cursor:default}
  .msg{font-size:13px;margin-top:8px;color:var(--err);min-height:18px}
  .msg.ok{color:var(--ok)}
  .link{background:none;border:none;color:var(--brand2);padding:0;font-weight:500;font-size:13px;margin-top:12px}
  .layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}
  .toolbar{display:flex;gap:8px;margin-bottom:10px}
  .list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px;transition:background .15s;animation:rise .35s both}
  .item:last-child{border-bottom:0}
  .item:hover{background:#fafbfd}.item.sel{background:var(--soft);box-shadow:inset 3px 0 0 var(--brand2)}
  .item b{display:block;font-size:14px}.item small{color:var(--muted);font-size:12px}
  .pill{font-size:11px;font-weight:700;border-radius:20px;padding:3px 9px;height:fit-content;white-space:nowrap;text-transform:capitalize}
  .pill.new{background:#fff4d6;color:#8a5a00}.pill.reviewed{background:#e3f4ea;color:var(--ok)}.pill.archived{background:#eee;color:#666}
  .empty{padding:30px;text-align:center;color:var(--muted);font-size:14px}
  .detail{animation:rise .35s both}
  .detail h3{font-size:14px;margin:20px 0 8px;color:var(--brand);display:flex;align-items:center;gap:8px}
  dl{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;margin:0;font-size:14px}
  @media (max-width:560px){dl{grid-template-columns:1fr}}
  dt{color:var(--muted)}dd{margin:0;word-break:break-word}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
  .sigimg{max-width:280px;max-height:80px;border-bottom:1px solid var(--line)}
  .reveal{font-size:12px;color:var(--brand2);cursor:pointer;margin-left:6px}
  .confirm{background:#fff8f7;border:1px solid #f1b4ae;border-radius:10px;padding:12px;margin-top:10px;font-size:14px;display:none}
  .flag{background:#fff4d6;color:#7a4f00;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
  .emp{margin-top:22px;border:1px solid #cfdcf0;background:linear-gradient(180deg,#f7faff,#fff);border-radius:14px;padding:18px}
  .emp h3{margin-top:0}
  .g{display:grid;grid-template-columns:repeat(4,1fr);gap:0 12px}
  .g .s2{grid-column:span 2}.g .s4{grid-column:span 4}
  @media (max-width:640px){.g{grid-template-columns:1fr 1fr}.g .s4,.g .s2{grid-column:span 2}}
  .seg{display:inline-flex;background:#e9eef6;border-radius:10px;padding:3px;margin:6px 0 4px}
  .seg button{background:transparent;border:0;padding:7px 14px;font-size:13px;border-radius:8px;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .doc{border:1px dashed #cfd8e6;border-radius:12px;padding:4px 12px 12px;margin-top:10px;background:#fff}
  .doc b{font-size:12px;color:var(--brand);display:block;margin-top:8px}
  .sigwrap{border:1.5px dashed #9aa7bb;border-radius:12px;background:#fbfcfe;position:relative;touch-action:none;margin-top:6px}
  .sigwrap canvas{width:100%;height:140px;display:block;cursor:crosshair}
  .sigwrap .ph{position:absolute;left:14px;bottom:10px;font-size:13px;color:#98a2b3;pointer-events:none}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-top:12px}
  .chk input{width:18px;height:18px;flex:none;margin-top:1px}
  .due{font-size:12.5px;color:var(--muted);margin-top:4px}
  .due.late{color:var(--err);font-weight:600}
  .done-badge{display:inline-flex;gap:6px;align-items:center;background:#e3f4ea;color:var(--ok);font-weight:700;font-size:12px;border-radius:20px;padding:4px 10px}
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand"><div class="mini">__TRUCK__</div><div><h1>C &amp; S Delivery · HR</h1><small>New hire submissions</small></div></div><div style="display:flex;gap:8px"><button id="chpw" class="hidden">Change password</button><button id="logout" class="hidden">Sign out</button></div></div></header>
<main>
  <div id="loginView" class="card login hidden">
    <h2>HR sign in</h2>
    <p style="color:var(--muted);font-size:14px;margin:0">Only authorized HR accounts can view submissions.</p>
    <form id="loginForm">
      <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
      <div class="msg" id="loginMsg"></div>
      <button class="primary" style="width:100%;margin-top:6px">Sign in</button>
    </form>
    <button class="link" id="forgot">Forgot password?</button>
  </div>

  <div id="resetView" class="card login hidden">
    <h2>Set a new password</h2><p style="color:var(--muted);font-size:13px;margin:0 0 4px">At least 10 characters.</p>
    <form id="resetForm">
      <label for="npw">New password</label><input id="npw" type="password" autocomplete="new-password" minlength="10" required>
      <div class="msg" id="resetMsg"></div>
      <button class="primary" style="width:100%;margin-top:6px">Save password</button>
    </form>
  </div>

  <div id="appView" class="hidden">
    <div class="layout">
      <div>
        <div class="toolbar">
          <select id="filter"><option value="active">New &amp; reviewed</option><option value="new">Needs employer review</option><option value="archived">Archived</option><option value="all">All</option></select>
          <button class="ghost" id="refresh" title="Refresh">↻</button>
        </div>
        <div class="list" id="list"><div class="empty">Loading…</div></div>
      </div>
      <div class="card detail" id="detail"><div class="empty">Select a submission to see it.</div></div>
    </div>
  </div>
</main>

<datalist id="listA"><option value="U.S. Passport"><option value="U.S. Passport Card"><option value="Permanent Resident Card (Form I-551)"><option value="Employment Authorization Document (Form I-766)"><option value="Foreign passport with Form I-94"></datalist>
<datalist id="listB"><option value="Driver's License"><option value="State ID Card"><option value="School ID with photograph"><option value="U.S. Military Card"><option value="Voter Registration Card"></datalist>
<datalist id="listC"><option value="Social Security Account Number Card"><option value="Birth Certificate"><option value="Certification of Report of Birth"><option value="Native American Tribal Document"><option value="Employment Authorization Document issued by DHS"></datalist>
<datalist id="authList"><option value="U.S. Department of State"><option value="USCIS"><option value="DHS"><option value="Texas DPS"><option value="Social Security Administration"><option value="State Vital Records"></datalist>

<script>
const SUPABASE_URL = "https://yxpjitdqqodfyqxvwglv.supabase.co";
const SUPABASE_KEY = "sb_publishable_jibRZ8TZlJvnEJGABG_Vbg_GGYHUhcg";
const COMPANY = { name: "C & S Delivery Service Inc.", address: "509 Gipson Manor Ct., Crowley, TX 76036" };
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, storage: window.sessionStorage } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ls = { get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let rows = [], current = null, me = null;

/*__FILL__*/

function view(v) { ["loginView", "resetView", "appView"].forEach(id => $(id).classList.toggle("hidden", id !== v)); $("logout").classList.toggle("hidden", v !== "appView"); $("chpw").classList.toggle("hidden", v !== "appView"); }
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "PASSWORD_RECOVERY") return view("resetView");
  if (session) { me = session.user; view("appView"); load(); } else view("loginView");
});
$("loginForm").onsubmit = async e => {
  e.preventDefault(); $("loginMsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (error) $("loginMsg").textContent = error.message;
};
$("forgot").onclick = async () => {
  const em = $("em").value.trim(); if (!em) { $("loginMsg").textContent = "Enter your email first."; return; }
  const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.href.split("#")[0] });
  $("loginMsg").className = error ? "msg" : "msg ok"; $("loginMsg").textContent = error ? error.message : "If that account exists, a reset link was emailed.";
};
$("resetForm").onsubmit = async e => {
  e.preventDefault(); const { error } = await sb.auth.updateUser({ password: $("npw").value });
  if (error) $("resetMsg").textContent = error.message; else { history.replaceState(null, "", location.pathname); view("appView"); load(); $("detail").innerHTML = '<div class="empty" style="color:var(--ok)">✓ Password updated.</div>'; }
};
$("logout").onclick = () => sb.auth.signOut();
$("chpw").onclick = () => { $("resetMsg").textContent = ""; $("npw").value = ""; view("resetView"); $("npw").focus(); };
$("refresh").onclick = () => load();
$("filter").onchange = () => load();

async function load() {
  $("list").innerHTML = '<div class="empty">Loading…</div>';
  let q = sb.from("hr_enrollments").select("id,created_at,employee_name,employee_email,status").order("created_at", { ascending: false }).limit(500);
  const f = $("filter").value;
  if (f === "active") q = q.in("status", ["new", "reviewed"]); else if (f !== "all") q = q.eq("status", f);
  const { data, error } = await q;
  if (error) { $("list").innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  rows = data;
  if (!rows.length) { $("list").innerHTML = '<div class="empty">No submissions here yet. If you expected some, make sure you signed in with the HR account.</div>'; return; }
  const label = { new: "needs review", reviewed: "complete", archived: "archived" };
  $("list").innerHTML = rows.map((r, i) => `<div class="item ${current && current.id === r.id ? "sel" : ""}" style="animation-delay:${Math.min(i, 12) * 30}ms" data-id="${r.id}"><div><b>${esc(r.employee_name)}</b><small>${new Date(r.created_at).toLocaleString()}</small></div><span class="pill ${r.status}">${label[r.status]}</span></div>`).join("");
  $("list").querySelectorAll(".item").forEach(el => el.onclick = () => open(el.dataset.id));
}

const FILING = { Single_MFS: "Single or Married filing separately", MFJ_QSS: "Married filing jointly / Qualifying surviving spouse", HeadOfHousehold: "Head of household" };
const CIT = { "1_Citizen": "1. U.S. citizen", "2_NoncitizenNational": "2. Noncitizen national", "3_PermanentResident": "3. Lawful permanent resident", "4_AlienAuthorized": "4. Noncitizen authorized to work" };
const maskv = (s, k = 4) => s ? `<span data-full="${esc(s)}">${"•".repeat(Math.max(0, s.length - k)) + esc(s.slice(-k))}</span><span class="reveal">show</span>` : "";
const isoToUS = v => { if (!v) return ""; const [y, m, d] = v.split("-"); return `${m}/${d}/${y}`; };
const usToISO = v => { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v || ""); return m ? `${m[3]}-${m[1]}-${m[2]}` : ""; };
const todayUS = () => { const d = new Date(); return `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}/${d.getFullYear()}`; };
function addBusinessDays(iso, n) { const d = new Date(iso + "T12:00:00"); let k = 0; while (k < n) { d.setDate(d.getDate() + 1); if (d.getDay() % 6) k++; } return d; }

async function open(id) {
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("sel", el.dataset.id === id));
  $("detail").innerHTML = '<div class="empty">Loading…</div>';
  const { data, error } = await sb.from("hr_enrollments").select("*").eq("id", id).single();
  if (error) { $("detail").innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  current = data; const d = data.data || {}, m = d._meta || {}, em = d._employer || null;
  const blk = (t, rs) => `<h3>${t}</h3><dl>${rs.filter(r => r[1] !== undefined && r[1] !== "" && r[1] !== false && r[1] !== null).map(r => `<dt>${r[0]}</dt><dd>${r[2] ? r[1] : esc(r[1])}</dd>`).join("")}</dl>`;
  $("detail").classList.remove("detail"); void $("detail").offsetWidth; $("detail").classList.add("detail");
  $("detail").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
      <h2 style="margin:0">${esc(data.employee_name)}</h2>${em ? '<span class="done-badge">✓ Employer section signed</span>' : '<span class="pill new">Needs employer review</span>'}
    </div>
    <div style="color:var(--muted);font-size:13px;margin-top:4px">Submitted ${new Date(data.created_at).toLocaleString()}</div>
    <div class="actions">
      <button class="primary" id="pdf">⬇ Download PDF${em ? "" : " (employee part only)"}</button>
      ${data.status !== "archived" ? '<button class="ghost" data-status="archived">Archive</button>' : '<button class="ghost" data-status="' + (em ? "reviewed" : "new") + '">Restore</button>'}
      <button class="danger" id="del">Delete</button>
    </div>
    <div class="msg" id="actMsg"></div>
    <div class="confirm" id="delBox">Permanently delete this submission? This can't be undone. (Federal rules require keeping I-9s for 3 years after hire or 1 year after employment ends, whichever is later.)<div class="actions"><button class="danger" id="delYes">Yes, delete</button><button class="ghost" id="delNo">Cancel</button></div></div>
    ${m.preparer ? '<div class="flag">⚠ The employee said someone helped them fill out or translate this form. Complete I-9 Supplement A (Preparer/Translator Certification) for this hire.</div>' : ""}
    ${d.W4_Exempt ? '<div class="flag">⚠ This employee claims exemption from federal withholding on the W-4.</div>' : ""}
    ${blk("Employee", [["Name", [d.I9_FirstName, d.I9_MiddleInitial, d.I9_LastName].filter(Boolean).join(" ")], ["Other last names", d.I9_OtherLastNames], ["Address", `${d.I9_Address || ""}${d.I9_Apt && d.I9_Apt !== "N/A" ? ", " + d.I9_Apt : ""}, ${d.I9_City || ""}, ${d.I9_State || ""} ${d.I9_ZIP || ""}`], ["Date of birth", d.I9_DOB], ["SSN", maskv(d.W4_SSN || d.I9_SSN), 1], ["Email", d.I9_Email], ["Phone", d.I9_Phone]])}
    ${blk("Direct deposit", [["Account type", d.DD_AccountType], ["Bank", d.DD_BankName], ["Routing", d.DD_RoutingNumber], ["Account", maskv(d.DD_AccountNumber), 1]])}
    ${blk("W-4", [["Filing status", FILING[d.W4_FilingStatus]], ["2(c) Two jobs", d.W4_Step2c_TwoJobs ? "Yes" : ""], ["3(a) Children", d.W4_Step3a && "$" + d.W4_Step3a], ["3(b) Other dependents", d.W4_Step3b && "$" + d.W4_Step3b], ["Step 3 total", d.W4_Step3Total && "$" + d.W4_Step3Total], ["4(a) Other income", d.W4_Step4a && "$" + d.W4_Step4a], ["4(b) Deductions", d.W4_Step4b && "$" + d.W4_Step4b], ["4(c) Extra withholding", d.W4_Step4c && "$" + d.W4_Step4c], ["Exempt", d.W4_Exempt ? "YES" : ""]])}
    ${blk("I-9 Section 1", [["Status", CIT[d.I9_CitizenshipStatus]], ["USCIS/A-Number (LPR)", d.I9_LPR_USCIS_ANumber], ["Authorization expires", d.I9_AlienExpDate], ["A-Number", d.I9_AlienANumber], ["I-94", d.I9_I94Number], ["Foreign passport", d.I9_ForeignPassport]])}
    ${blk("Employee signature", [["Signature", data.signatures && data.signatures.employee ? `<img class="sigimg" src="${esc(data.signatures.employee)}" alt="signature">` : "", 1], ["Typed name", m.typed_name], ["Signed", m.signed_at && new Date(m.signed_at).toLocaleString()], ["Attestations", m.attest ? Object.entries(m.attest).map(([k, v]) => `${k.replace("_", " ")}: ${v ? "✓" : "✗"}`).join(" · ") : ""]])}
    ${em ? blk("Employer section", [["Documents", [d.I9_ListA_DocTitle1 && "List A: " + d.I9_ListA_DocTitle1, d.I9_ListB_DocTitle && "List B: " + d.I9_ListB_DocTitle, d.I9_ListC_DocTitle && "List C: " + d.I9_ListC_DocTitle].filter(Boolean).join(" · ")], ["First day", d.I9_FirstDayEmployment], ["Signed by", d.I9_EmployerRepNameTitle], ["Signature", data.signatures && data.signatures.employer ? `<img class="sigimg" src="${esc(data.signatures.employer)}" alt="employer signature">` : "", 1], ["Signed", em.signed_at && new Date(em.signed_at).toLocaleString()]]) + '<div class="actions"><button class="ghost" id="editEmp">Edit employer section</button></div>' : ""}
    <div id="empBox" class="${em ? "hidden" : ""}"></div>`;
  $("detail").querySelectorAll(".reveal").forEach(el => el.onclick = () => { const s = el.previousElementSibling; s.textContent = s.dataset.full; el.remove(); });
  $("detail").querySelectorAll("[data-status]").forEach(b => b.onclick = () => setStatus(b.dataset.status));
  $("pdf").onclick = downloadPdf;
  $("del").onclick = () => $("delBox").style.display = "block";
  $("delNo").onclick = () => $("delBox").style.display = "none";
  $("delYes").onclick = async () => {
    const { error } = await sb.from("hr_enrollments").delete().eq("id", current.id);
    if (error) { $("actMsg").textContent = error.message; return; }
    current = null; $("detail").innerHTML = '<div class="empty">Deleted.</div>'; load();
  };
  renderEmployer();
  if ($("editEmp")) $("editEmp").onclick = () => { $("empBox").classList.remove("hidden"); $("empBox").scrollIntoView({ behavior: "smooth" }); };
}

// ---------- employer section (I-9 Section 2 + W-4 employer box) ----------
function docFields(prefix, n, listId, label) {
  const sfx = n === null ? "" : n;
  const v = k => esc((current.data || {})[`I9_${prefix}_${k}${sfx}`] || "");
  return `<div class="doc"><b>${label}</b><div class="g">
    <div class="s4"><label>Document title</label><input data-k="I9_${prefix}_DocTitle${sfx}" list="${listId}" value="${v("DocTitle")}"></div>
    <div class="s2"><label>Issuing authority</label><input data-k="I9_${prefix}_IssuingAuthority${sfx}" list="authList" value="${v("IssuingAuthority")}"></div>
    <div class="s2"><label>Document number</label><input data-k="I9_${prefix}_DocNumber${sfx}" value="${v("DocNumber")}"></div>
    <div class="s2"><label>Expiration date <span style="font-weight:400;color:var(--muted)">(if any)</span></label><input type="date" data-k="I9_${prefix}_ExpDate${sfx}" data-date="1" value="${usToISO((current.data || {})[`I9_${prefix}_ExpDate${sfx}`])}"></div>
  </div></div>`;
}
function renderEmployer() {
  const d = current.data || {};
  const useA = !!d.I9_ListA_DocTitle1 || !(d.I9_ListB_DocTitle || d.I9_ListC_DocTitle);
  const repDefault = d.I9_EmployerRepNameTitle || ls.get("cs_rep");
  $("empBox").innerHTML = `<div class="emp">
    <h3>✍ Employer review — I-9 Section 2 &amp; W-4</h3>
    <div style="font-size:13px;color:var(--muted)">Physically examine the employee's <b>original</b> documents (no photocopies) and record them here. The employee chooses which documents to show.</div>
    <div class="g" style="margin-top:6px">
      <div class="s2"><label>First day of employment</label><input type="date" id="firstDay" data-k="I9_FirstDayEmployment" data-date="1" value="${usToISO(d.I9_FirstDayEmployment)}"><div class="due" id="due"></div></div>
    </div>
    <div class="seg" id="seg"><button type="button" data-l="A" class="${useA ? "on" : ""}">List A document</button><button type="button" data-l="BC" class="${useA ? "" : "on"}">List B + List C</button></div>
    <div id="docsA" class="${useA ? "" : "hidden"}">${docFields("ListA", 1, "listA", "List A – Document 1")}
      <details style="margin-top:8px"><summary style="font-size:13px;cursor:pointer;color:var(--brand2)">Add document 2 or 3 (some List A documents come in combinations)</summary>${docFields("ListA", 2, "listA", "List A – Document 2")}${docFields("ListA", 3, "listA", "List A – Document 3")}</details></div>
    <div id="docsBC" class="${useA ? "hidden" : ""}">${docFields("ListB", null, "listB", "List B – Identity")}${docFields("ListC", null, "listC", "List C – Employment authorization")}</div>
    <label>Additional information <span style="font-weight:400;color:var(--muted)">(optional)</span></label><textarea rows="2" data-k="I9_AdditionalInfo">${esc(d.I9_AdditionalInfo || "")}</textarea>
    <label class="chk" style="font-weight:400"><input type="checkbox" data-k="I9_AltProcedure" ${d.I9_AltProcedure ? "checked" : ""}> I used an alternative procedure authorized by DHS to examine documents (remote examination).</label>
    <div class="g" style="margin-top:6px">
      <div class="s4"><label>Your last name, first name and title</label><input data-k="I9_EmployerRepNameTitle" placeholder="Smith, Jordan – Owner" value="${esc(repDefault)}"></div>
      <div class="s2"><label>Business name</label><input data-k="I9_EmployerBusinessName" value="${esc(d.I9_EmployerBusinessName || COMPANY.name)}"></div>
      <div class="s2"><label>Business address</label><input data-k="I9_EmployerBusinessAddress" value="${esc(d.I9_EmployerBusinessAddress || COMPANY.address)}"></div>
      <div class="s2"><label>Employer EIN (for W-4)</label><input data-k="W4_EIN" placeholder="12-3456789" value="${esc(d.W4_EIN || ls.get("cs_ein"))}"></div>
    </div>
    <label style="margin-top:12px">Your signature</label>
    <div class="sigwrap"><canvas id="esig"></canvas><div class="ph" id="esigph">Sign here</div></div>
    <div style="display:flex;justify-content:flex-end;margin-top:6px"><button type="button" class="ghost" id="esigClear" style="padding:6px 12px;font-size:12.5px">Clear</button></div>
    <label class="chk" style="font-weight:400"><input type="checkbox" id="certify"> <span><b>Certification:</b> I attest, under penalty of perjury, that (1) I have examined the documentation presented by the above-named employee, (2) the above-listed documentation appears to be genuine and to relate to the employee named, and (3) to the best of my knowledge, the employee is authorized to work in the United States.</span></label>
    <div class="msg" id="empMsg"></div>
    <div class="actions"><button class="amber" id="empSave">Sign &amp; complete</button></div>
  </div>`;
  $("seg").querySelectorAll("button").forEach(b => b.onclick = () => {
    $("seg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    $("docsA").classList.toggle("hidden", b.dataset.l !== "A"); $("docsBC").classList.toggle("hidden", b.dataset.l === "A");
  });
  const updDue = () => { const v = $("firstDay").value; if (!v) { $("due").textContent = ""; return; } const due = addBusinessDays(v, 3); const late = new Date() > new Date(due.getFullYear(), due.getMonth(), due.getDate(), 23, 59); $("due").className = "due" + (late ? " late" : ""); $("due").textContent = `Section 2 due by ${due.toLocaleDateString()}${late ? " — past due, complete now" : ""}`; };
  $("firstDay").oninput = updDue; updDue();
  const pad = makePad($("esig"), $("esigph")); $("esigClear").onclick = pad.clear;
  $("empSave").onclick = async () => {
    const msg = $("empMsg"); msg.className = "msg"; msg.textContent = "";
    const box = $("empBox"), useA = $("seg").querySelector(".on").dataset.l === "A";
    const vals = {};
    box.querySelectorAll("[data-k]").forEach(el => {
      if ((useA && el.closest("#docsBC")) || (!useA && el.closest("#docsA"))) { vals[el.dataset.k] = el.type === "checkbox" ? false : ""; return; }
      vals[el.dataset.k] = el.type === "checkbox" ? el.checked : el.dataset.date ? isoToUS(el.value) : el.value.trim();
    });
    if (!vals.I9_FirstDayEmployment) return msg.textContent = "Enter the first day of employment.";
    if (useA && !(vals.I9_ListA_DocTitle1 && vals.I9_ListA_DocNumber1)) return msg.textContent = "Enter the List A document title and number.";
    if (!useA && !(vals.I9_ListB_DocTitle && vals.I9_ListC_DocTitle)) return msg.textContent = "Enter both a List B and a List C document.";
    if (!vals.I9_EmployerRepNameTitle) return msg.textContent = "Enter your name and title.";
    if (!pad.has()) return msg.textContent = "Please sign.";
    if (!$("certify").checked) return msg.textContent = "Check the certification box.";
    vals.I9_EmployerSignDate = todayUS();
    vals.W4_FirstDateEmployment = vals.I9_FirstDayEmployment;
    vals.W4_EmployerNameAddress = `${vals.I9_EmployerBusinessName}\n${vals.I9_EmployerBusinessAddress}`;
    vals._employer = { signed_at: new Date().toISOString(), signed_by_user: me && me.id, signed_by_email: me && me.email, method: useA ? "List A" : "List B + C" };
    ls.set("cs_rep", vals.I9_EmployerRepNameTitle); if (vals.W4_EIN) ls.set("cs_ein", vals.W4_EIN);
    const newData = Object.assign({}, current.data, vals);
    const newSigs = Object.assign({}, current.signatures, { employer: pad.png() });
    $("empSave").disabled = true; $("empSave").textContent = "Saving…";
    const { error } = await sb.from("hr_enrollments").update({ data: newData, signatures: newSigs, status: "reviewed" }).eq("id", current.id);
    if (error) { msg.textContent = error.message; $("empSave").disabled = false; $("empSave").textContent = "Sign & complete"; return; }
    await load(); await open(current.id); $("actMsg").className = "msg ok"; $("actMsg").textContent = "Employer section signed. The PDF now includes both signatures.";
  };
}
function makePad(c, ph) {
  const ctx = c.getContext("2d"); let drawing = false, last = null, has = false;
  const r0 = c.getBoundingClientRect(); c.width = r0.width * 2; c.height = r0.height * 2; ctx.scale(2, 2);
  ctx.lineWidth = 2.4; ctx.lineCap = ctx.lineJoin = "round"; ctx.strokeStyle = ctx.fillStyle = "#0d1b4c";
  const pt = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener("pointerdown", e => { drawing = true; last = pt(e); c.setPointerCapture(e.pointerId); });
  c.addEventListener("pointermove", e => { if (!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; if (!has) { has = true; ph.style.display = "none"; } });
  ["pointerup", "pointercancel", "pointerleave"].forEach(t => c.addEventListener(t, () => drawing = false));
  return {
    has: () => has,
    clear() { ctx.clearRect(0, 0, c.width, c.height); has = false; ph.style.display = ""; },
    png() {
      const w = c.width, h = c.height, d = ctx.getImageData(0, 0, w, h).data; let x0 = w, y0 = h, x1 = 0, y1 = 0;
      for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (d[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      const p = 8; x0 = Math.max(0, x0 - p); y0 = Math.max(0, y0 - p); x1 = Math.min(w, x1 + p); y1 = Math.min(h, y1 + p);
      const t = document.createElement("canvas"), sc = Math.min(1, 600 / (x1 - x0)); t.width = Math.round((x1 - x0) * sc); t.height = Math.round((y1 - y0) * sc);
      t.getContext("2d").drawImage(c, x0, y0, x1 - x0, y1 - y0, 0, 0, t.width, t.height); return t.toDataURL("image/png");
    }
  };
}
async function setStatus(s) {
  const { error } = await sb.from("hr_enrollments").update({ status: s }).eq("id", current.id);
  if (error) { $("actMsg").textContent = error.message; return; }
  await load(); open(current.id);
}
let template = null;
async function downloadPdf() {
  const b = $("pdf"), label = b.textContent; b.disabled = true; b.textContent = "Building PDF…"; $("actMsg").textContent = "";
  try {
    if (!template) { const r = await fetch("packet-template.pdf"); if (!r.ok) throw new Error("packet-template.pdf is missing next to this page."); template = await r.arrayBuffer(); }
    const bytes = await fillPacket(PDFLib, template, current);
    const d = current.data || {}, name = `${d.I9_LastName || "employee"}_${d.I9_FirstName || ""}_new_hire_packet.pdf`.replace(/[^\w.-]+/g, "_");
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  } catch (e) { $("actMsg").textContent = "Couldn't build the PDF: " + e.message; }
  b.disabled = false; b.textContent = label;
}
